[project]
name = "valleyfloor"
version = "1.2.0"
description = "vhs (Valley Hillslope Separator): delineate valley floors from a conditioned DEM and a reach-labeled channel network by combining slope-based region growing with reach-specific flood-fill thresholds"
license = "MIT"
authors = [
    {name = "Arthur Koehl", email = "avkoehl@ucdavis.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "geopandas>=1.1.1",
    "loguru>=0.7.2",
    "numba>=0.62.1",
    "numpy>=2.0.0",
    "rioxarray>=0.19.0",
    "scikit-image>=0.25.0",
    "scipy>=1.16.0",
    "shapelysmooth>=0.2.1",
    "xarray>=2025.1.0",
]

[dependency-groups]
dev = [
    "ipython>=9.4.0",
    "matplotlib>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vhs"]
