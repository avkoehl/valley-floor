project:
  type: website
  output-dir: _site

website:
  title: "valley-floor"
  repo-url: https://github.com/avkoehl/valley-floor
  repo-actions: [issue]
  navbar:
    right:
      - icon: github
        href: https://github.com/avkoehl/valley-floor
    left:
